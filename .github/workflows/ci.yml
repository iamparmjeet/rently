name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: rently_db_user
          POSTGRES_PASSWORD: rently_db_password
          POSTGRES_DB: rently_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rently_db_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Create test database
        run: psql "postgresql://rently_db_user:rently_db_password@localhost:5432/rently_db" -c "CREATE DATABASE rently_test OWNER rently_db_user;"

      - name: Write CI test env
        run: |
          cat > apps/server/.env.test <<'EOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://rently_db_user:rently_db_password@localhost:5432/rently_test
          BETTER_AUTH_URL=http://localhost:3000
          NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          NEXT_PUBLIC_WEB_URL=http://localhost:3001
          NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3002
          NEXT_PUBLIC_TENANT_URL=http://localhost:3003
          NEXT_PUBLIC_ADMIN_URL=http://localhost:3004
          EOF

      - name: Schema drift check
        run: bun run --filter @rently/db db:generate && git diff --exit-code -- packages/db/src/schema
        env:
          DATABASE_URL: postgresql://rently_db_user:rently_db_password@localhost:5432/rently_test

      - name: Migrate test database
        run: |
          bun run --filter @rently/db db:migrate:test
          psql "postgresql://rently_db_user:rently_db_password@localhost:5432/rently_test" -c "VACUUM (ANALYZE);"

      - name: Type check (6 packages)
        run: bun run check-types

      - name: Biome lint
        run: bunx biome check .

      - name: Build (5 apps + packages)
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_WEB_URL: http://localhost:3001
          NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3002
          NEXT_PUBLIC_TENANT_URL: http://localhost:3003
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3004

      - name: Tests (Vitest, rently_test - no Neon)
        run: bun run test
        env:
          SKIP_ENV_VALIDATION: "true"
