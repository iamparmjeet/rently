name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Type check (6 packages)
        run: bun run check-types

      - name: Biome lint
        run: bunx biome check .

      - name: Build (5 apps + packages)
        run: bun run build

      - name: Tests (Vitest, rently_test - no Neon)
        run: bun run test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SKIP_ENV_VALIDATION: "true"
